name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build standalone Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo dependency versions
        run: npx expo install --check

      - name: Run project checks
        run: npm run verify

      - name: Generate Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Build standalone release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify JavaScript bundle is inside APK
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path

          apk = Path('android/app/build/outputs/apk/release/app-release.apk')
          if not apk.is_file():
              raise SystemExit(f'APK not found: {apk}')

          with ZipFile(apk) as archive:
              bundle_name = 'assets/index.android.bundle'
              if bundle_name not in archive.namelist():
                  raise SystemExit(
                      f'FAIL: {bundle_name} is missing. Refusing to upload an APK that needs Metro.'
                  )
              size = archive.getinfo(bundle_name).file_size
              if size < 1024:
                  raise SystemExit(f'FAIL: JS bundle is unexpectedly small ({size} bytes).')
              print(f'PASS: {bundle_name} is packaged ({size:,} bytes).')
          PY

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: madreseyar-parent-v1.2.3-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
